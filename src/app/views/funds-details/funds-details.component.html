<div id="content">
	<div class="page-header">
		<div class="container">
			<div class="row">
				<div class="col-xs-12 col-sm-12">
					<h1 class="heading-title">Investment-Linked Funds Historical Pricing</h1>
				</div>
			</div>
		</div>
	</div>
	<div class="main-content">
		<div class="container">
			<div class="row">
				<div class="col-xs-12 col-sm-12">
					<div class="funds-details-section">
						<form>
							<div class="row">
								<div class="funds-dropdown col-xs-12 col-sm-6 mx-sm-auto">
									<select class="form-control mb-4" (change)="onChange($event.target.value)">
										<option *ngFor="let fund of funds" value="{{ fund.id }}" [selected]="fund.id == fundID">{{ fund.name }}</option>
									</select>
								</div>
							</div>
							<div class="fund-details">
								<h2 class="fund-name text-center mb-2">{{ fundDetails.name }}</h2>
								<p class="fund-description">{{ fundDetails.description }}</p>
								<div class="fund-meta">
									<p class="fund-daily-price">{{ fundDetails.price }}</p>
									<p class="fund-launch-price">+0.126</p>
									<p class="fund-current-date">AS AT {{ fundDetails.as_at }}</p>
								</div>
								<div class="chart-wrapper mt-2 mb-5">
									<div [chart]="chart"></div>
								</div>
								<div class="row">
									<div class="funds-filters col-xs-12 col-sm-6 mx-sm-auto">
										<div class="form-group">
											<label for="from">FROM</label>
											<input type="text" name="from" class="form-control" value="" placeholder="YYYY-MM-DD" />
										</div>
										<div class="form-group">
											<label for="to">TO</label>
											<input type="text" name="to" class="form-control" value="" placeholder="YYYY-MM-DD" />
										</div>
										<div class="form-group">
											<button class="btn btn-primary">UPDATE</button>
										</div>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
